services:
  caddy:
    image: caddy:latest
    environment:
      BACKEND_HOST: ${DEV_BACKEND_HOST}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      swagger:
        condition: service_started

  db:
    image: postgres:18
    container_name: vending-db-dev
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    volumes:
      - db-data-dev:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DEV_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  swagger:
    image: swaggerapi/swagger-ui:latest
    environment:
      URL: /openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    restart: unless-stopped

volumes:
  db-data-dev:
  caddy_data:
  caddy_config:
